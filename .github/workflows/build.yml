name: Build/release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create draft GitHub release'
        required: false
        type: boolean
        default: true

env:
  MAIN_VITE_LAST_FM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
  MAIN_VITE_GENIUS_API_KEY: ${{ secrets.GENIUS_API_KEY }}
  MAIN_VITE_LAST_FM_SHARED_SECRET: ${{ secrets.LAST_FM_SHARED_SECRET }}
  MAIN_VITE_ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
  MAIN_VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}

jobs:
  test-js:
    name: Test JS/TS
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit --include=optional

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest tests
        run: npm test

  test-rust:
    name: Test Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Linux audio dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: audio-engine

      - name: Run Cargo tests
        run: cargo test --manifest-path audio-engine/Cargo.toml

  build-vite:
    name: Build Electron/Vite Bundle
    needs: [test-js]
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit --include=optional

      - name: Build Vite bundle
        run: npx electron-vite build

      - name: Upload Vite build artifact
        uses: actions/upload-artifact@v7
        with:
          name: vite-out
          path: out/
          retention-days: 1

  build-rust:
    name: Build Native Audio Engine (${{ matrix.os }})
    needs: [test-rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit --include=optional

      - name: Install Linux audio dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: audio-engine

      - name: Build Native Audio Engine
        run: npm run build:engine

      - name: Upload Audio Engine artifact
        uses: actions/upload-artifact@v7
        with:
          name: audio-engine-${{ matrix.os }}
          path: audio-engine/dist/
          retention-days: 1

  package-electron:
    name: Package Electron App (${{ matrix.os }})
    needs: [build-vite, build-rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-fund --no-audit --include=optional
          npm rebuild rollup

      - name: Download Vite build artifact
        uses: actions/download-artifact@v8
        with:
          name: vite-out
          path: out

      - name: Download Audio Engine artifact
        uses: actions/download-artifact@v8
        with:
          name: audio-engine-${{ matrix.os }}
          path: audio-engine/dist

      - name: Ensure workspace audio-engine dist synchronization
        run: node -e "const fs = require('fs'); const src = 'audio-engine/dist'; const dest = 'node_modules/audio-engine/dist'; if (fs.existsSync(src) && !fs.existsSync(dest)) { fs.cpSync(src, dest, { recursive: true }); }"

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run package:linux

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: npm run package:mac-arm64

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: npm run package:win-x64

      - name: Create draft release
        if: inputs.create_release == true || inputs.create_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Nora Release ${{ github.ref_name }} ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
