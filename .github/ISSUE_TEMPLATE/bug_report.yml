name: "🐛 Bug Report"
description: Report a bug or unexpected behavior in Nora
title: "[Bug]: "
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: 
        1. Open Nora
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
      placeholder: Describe what should have happened...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Recordings
      description: Add screenshots or recordings if applicable.

  - type: input
    id: nora_version
    attributes:
    label: Nora Version
    placeholder: e.g. v3.1.0-stable
    validations:
    required: true

  - type: dropdown
    id: architecture
    attributes:
    label: CPU Architecture
    options:
      - ARM64
      - x86_64 (Intel/AMD)
      - Unknown
    validations:
    required: true

  - type: dropdown
    id: operating_system
    attributes:
    label: Operating System
    options:
      - macOS
      - Windows
      - Linux
    validations:
    required: true

  - type: input
    id: os_version
    attributes:
    label: OS Version
    description: Enter your operating system version. 
    placeholder: e.g. macOS 27 Golden Gate, Windows 11 24H2, Ubuntu 24.04
    validations:
    required: true

  - type: input
    id: installation_method
    attributes:
      label: Installation Method
      placeholder: EXE, DMG, GitHub Release, etc.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.